name: release

# Tag-driven release. Push a tag like `v0.3.1` (or run this workflow manually and
# pass the tag) and every matrix job builds its installers and uploads them to the
# SAME GitHub release for that tag.
#
# The release is created as a DRAFT on purpose: the four jobs finish at different
# times, and the in-app updater (src-tauri/src/update.rs) reads
# `releases/latest`, which ignores drafts. Publishing the draft by hand once all
# assets are attached means users never see a half-uploaded release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (defaults to the current ref name)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Create (or reuse) the draft release ONCE, before the matrix starts. When
  # every build job let tauri-action create the release by tag, two jobs that
  # finished at the same moment each created one: v0.9.2 ended up with two
  # releases for the same tag and the Windows installers in an unpublished
  # duplicate. The build jobs now upload to this release by id.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="fire-speak $TAG" \
              -f body='See the assets below to download and install this version.' \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 -> NSIS (*-setup.exe) + MSI, from bundle.targets.
          - label: windows-x86_64
            platform: windows-latest
            args: ''

          # Linux x86_64. ubuntu-22.04 (jammy) is the OLDEST GitHub-hosted image
          # that still ships libwebkit2gtk-4.1-dev, so it gives the lowest glibc
          # floor (2.35). Building on ubuntu-24.04 would raise it to 2.39 and the
          # .deb/AppImage would refuse to start on Linux Mint 21 / Ubuntu 22.04.
          - label: linux-x86_64
            platform: ubuntu-22.04
            args: ''

          # Linux aarch64, built natively on GitHub's Arm64 image (no cross-compile).
          - label: linux-aarch64
            platform: ubuntu-22.04-arm
            args: ''

          # Windows arm64. Tauri's WiX/MSI bundler has no arm64 support, so this
          # job is NSIS-only. The installer keeps its natural
          # `..._arm64-setup.exe` name: update.rs matches release assets by
          # architecture token, so it can no longer hand an x86_64 user this file.
          - label: windows-arm64
            platform: windows-11-arm
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    # Windows-on-Arm is unproven for this app (low-level keyboard hook, x64-only
    # whisper.cpp server downloads), so it must not block an otherwise good release.
    continue-on-error: ${{ matrix.label == 'windows-arm64' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils \
            libasound2-dev \
            libxdo-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # package-lock.json is committed, so npm's cache can be keyed off it.
          package-manager-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the bundles (bundle.createUpdaterArtifacts) so the in-app
          # updater can verify them against plugins.updater.pubkey. Key has
          # no password; the matching public key lives in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password, but the CLI prompts (and hangs) unless the
          # variable exists, so it must be set to the empty string explicitly.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # Explicit so the local @tauri-apps/cli from package.json is used
          # rather than a globally installed one.
          tauriScript: npm run tauri
          # Upload into the draft created by the create-release job (never
          # create a release here — parallel jobs would race).
          releaseId: ${{ needs.create-release.outputs.id }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          # latest.json for tauri-plugin-updater. Each matrix job merges its
          # platform entry into the same asset. The installed app came from the
          # NSIS setup.exe, so windows-x86_64 must point at the NSIS bundle,
          # not the MSI (installing the MSI on top would leave two copies).
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
