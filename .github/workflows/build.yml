name: build-artifacts

# Manual test build. Produces the real installers and uploads them as workflow
# artifacts WITHOUT creating a git tag or a GitHub release — use it to grab a
# .deb/.rpm/.AppImage and try it on a real machine before cutting a release.
# Cutting an actual release is release.yml's job.
#
# All three targets always build: the `matrix` context is not available in a
# job-level `if`, so filtering by an input would need a separate matrix-builder
# job — not worth the complexity for a manual test build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            platform: ubuntu-22.04
          - label: linux-aarch64
            platform: ubuntu-22.04-arm
          - label: windows-x86_64
            platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xdg-utils \
            libasound2-dev \
            libxdo-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers
        run: npm run tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: fire-speak-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
